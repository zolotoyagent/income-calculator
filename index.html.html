<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор дохода кредитного агента</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f9f9f9; }
  h1 { font-size: 22px; text-align: center; }
  .scenarios { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
  .scenarios button { flex: 1; padding: 10px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; background: #e0e0e0; transition: 0.2s; }
  .scenarios button:hover { background: #d0d0d0; }
  .scenarios button.active { background: #2e7d32; color: white; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  .result { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 8px; }
  .result p { margin: 6px 0; font-size: 16px; }
  .total { font-size: 20px; font-weight: bold; color: #2e7d32; }
  .note { font-size: 13px; color: #777; margin-top: 10px; }
</style>
</head>
<body>
<h1>Калькулятор дохода агента</h1>

<div class="scenarios">
  <button onclick="setScenario('normal')" id="btn-normal" class="active">Обычная сделка</button>
  <button onclick="setScenario('cross')" id="btn-cross">С кросс-продажами</button>
  <button onclick="setScenario('high')" id="btn-high">С повышенной ставкой</button>
</div>

<label>Сумма кредита, ₽</label>
<input type="number" id="amount" value="1000000">

<label>Ваша ставка, %</label>
<input type="number" id="rate" value="3" step="0.1">

<label>Налоговый режим</label>
<select id="taxMode">
  <option value="4">Самозанятый — 4% (с физлиц)</option>
  <option value="6">Самозанятый — 6% (с юрлиц)</option>
  <option value="6">ИП УСН «Доходы» — 6%</option>
  <option value="15">ИП УСН «Доходы-расходы» — 15%</option>
</select>

<label>Расходы на сделку, ₽</label>
<input type="number" id="expenses" value="5000">

<label>Комиссия платёжной системы, %</label>
<input type="number" id="ps" value="1" step="0.1">

<label>Количество сделок в месяц</label>
<input type="number" id="deals" value="10">

<button onclick="calc()" style="margin-top:15px; padding:10px 20px; font-size:16px;">Рассчитать</button>

<div class="result" id="result"></div>

<p class="note">Значения в сценариях можно менять в коде (функция setScenario).</p>

<script>
function setScenario(type) {
  // Сброс активного класса
  document.querySelectorAll('.scenarios button').forEach(b => b.classList.remove('active'));
  
  let amount, rate;
  if (type === 'normal') {
    amount = 1000000;
    rate = 3;
    document.getElementById('btn-normal').classList.add('active');
  } else if (type === 'cross') {
    amount = 1300000;
    rate = 3;
    document.getElementById('btn-cross').classList.add('active');
  } else if (type === 'high') {
    amount = 1000000;
    rate = 7;
    document.getElementById('btn-high').classList.add('active');
  }
  document.getElementById('amount').value = amount;
  document.getElementById('rate').value = rate;
  calc();
}

function calc() {
  const amount = +document.getElementById('amount').value;
  const rate = +document.getElementById('rate').value;
  const taxRate = +document.getElementById('taxMode').value;
  const expenses = +document.getElementById('expenses').value;
  const psPercent = +document.getElementById('ps').value;
  const deals = +document.getElementById('deals').value;

  const commission = amount * rate / 100;
  const tax = commission * taxRate / 100;
  const psCommission = commission * psPercent / 100;
  const totalExpenses = tax + expenses + psCommission;
  const net = commission - totalExpenses;
  const monthly = net * deals;

  document.getElementById('result').innerHTML = `
    <p>Комиссия агента: <b>${commission.toLocaleString('ru-RU')} ₽</b></p>
    <p>Налог: ${tax.toLocaleString('ru-RU')} ₽</p>
    <p>Комиссия ПС: ${psCommission.toLocaleString('ru-RU')} ₽</p>
    <p>Итого расходов: ${totalExpenses.toLocaleString('ru-RU')} ₽</p>
    <p class="total">Чистый доход с одной сделки: ${net.toLocaleString('ru-RU')} ₽</p>
    <p class="total">Доход в месяц (${deals} сделок): ${monthly.toLocaleString('ru-RU')} ₽</p>
  `;
}

// Первоначальный расчёт при загрузке
calc();
</script>
</body>
</html>
